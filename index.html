<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <title>Span Focus</title>
  
  <meta name="theme-color" content="#0d0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Focus">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <!-- HEADER -->
    <header>
      <div class="brand">
        <span class="brand-name">Span</span>
        <span class="brand-app" id="headerTitle">Focus</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="soundBtn" onclick="toggleBrownNoise()" title="Brown Noise Generator">
          <span>🎧</span>
          <span id="soundLabel">Sound</span>
        </button>
        <button class="plan-bridge-btn" onclick="alert('Span Plan integration coming soon!')">Plan ↗</button>
      </div>
    </header>

    <!-- PROGRESSION QUOTIDIENNE -->
    <div class="goal-tracker">
      <div class="goal-meta">
        <span>Daily Goal</span>
        <span id="goalPercent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="goalBar"></div>
      </div>
    </div>

    <!-- VUE 1 : FOCUS -->
    <div id="view-focus" class="view-content active">
      <div class="spotlight-card" id="spotlightCard" style="display: none;">
        <div class="spotlight-info">
          <span class="spotlight-label">Active Focus</span>
          <span class="spotlight-title" id="spotlightText">Task name</span>
        </div>
        <div class="spotlight-actions">
          <button class="btn-spotlight-action" onclick="completeSpotlightTask()">Done ✓</button>
          <button class="btn-spotlight-action" onclick="dismissSpotlightTask()">↩ List</button>
        </div>
      </div>

      <section class="timer-section">
        <div class="mode-switch">
          <button class="mode-btn active" id="modePomodoro" onclick="setTimerMode('pomodoro')">Pomodoro</button>
          <button class="mode-btn" id="modeCustom" onclick="setTimerMode('custom')">Custom</button>
          <button class="mode-btn" id="modeStopwatch" onclick="setTimerMode('stopwatch')">Stopwatch</button>
        </div>

        <div class="preset-pills" id="presetPills">
          <button class="preset-pill active" onclick="setDuration(25)">25m</button>
          <button class="preset-pill" onclick="setDuration(50)">50m</button>
          <button class="preset-pill" onclick="setDuration(5)">5m break</button>
        </div>

        <svg class="focus-growth-svg" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="16" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
          <path id="growthLeaf" d="M20 28 C20 28 20 22 20 18" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>

        <div class="time-display" id="timeDisplay">25:00</div>

        <div class="controls">
          <button class="btn-main" id="btnToggle" onclick="toggleTimer()">Start</button>
          <button class="btn-reset" onclick="resetTimer()" title="Reset">↺</button>
        </div>
      </section>
    </div>

    <!-- VUE 2 : TASKS -->
    <div id="view-tasks" class="view-content">
      <div class="task-input-container">
        <input type="text" class="task-input" id="taskInput" placeholder="Add task... (Enter)" onkeydown="if(event.key==='Enter') addTask()">
        <select class="category-select" id="taskCategory">
          <option value="Code">Code</option>
          <option value="Study">Study</option>
          <option value="Write">Write</option>
          <option value="Admin">Admin</option>
        </select>
        <button class="btn-add" onclick="addTask()">Add</button>
      </div>

      <ul class="task-list" id="taskList"></ul>
      <div style="font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 4px;">
        Shortcuts: ↑ / ↓ select • Space: timer • Enter: complete • Tab: edit • D: delete
      </div>
    </div>

    <!-- VUE 3 : TRACK / STATS -->
    <div id="view-stats" class="view-content">
      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-sub">Category Breakdown</span>
          <button class="toggle-unit-btn" id="btnToggleUnit" onclick="toggleChartUnit()">Show: Time</button>
        </div>
        <div class="pie-container">
          <div class="pie-chart" id="pieChart"></div>
          <div class="pie-legend" id="pieLegend"></div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-sub">Data & Cloud Backup (JSON)</div>
        <div class="backup-section">
          <button class="btn-backup" onclick="exportData()">Download Backup</button>
          <label class="btn-backup" style="cursor: pointer;">
            Import Backup
            <input type="file" id="importFileInput" style="display: none;" onchange="importData(event)">
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- NAVIGATION BAR -->
  <nav class="nav-bar">
    <div class="nav-items">
      <button class="nav-btn active" onclick="switchView('focus', this)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Focus</span>
      </button>
      <button class="nav-btn" onclick="switchView('tasks', this)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>Tasks</span>
      </button>
      <button class="nav-btn" onclick="switchView('stats', this)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Track</span>
      </button>
    </div>
  </nav>

  <!-- SCRIPTS DÉCOUPÉS -->
  <script src="js/audio.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/track.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
